# Trophy Heaven backend on Render. Step-by-step guide: docs/deployment.md
# Everything runs in Singapore, the closest Render region to India, on one private network.
# Values marked `sync: false` are asked for once, when the Blueprint is first created.

databases:
  - name: trophy-heaven-db
    databaseName: trophy_heaven
    user: medusa
    region: singapore
    plan: basic-1gb
    diskSizeGB: 10
    postgresMajorVersion: "16"
    ipAllowList: []

services:
  - type: keyvalue
    name: trophy-heaven-redis
    region: singapore
    plan: 256mb
    # Redis holds the event and workflow queues, so it must never drop keys.
    maxmemoryPolicy: noeviction
    ipAllowList: []

  - type: pserv
    name: trophy-heaven-search
    runtime: image
    image:
      url: docker.io/getmeili/meilisearch:v1.11
    region: singapore
    plan: 0.5c-512mb
    disk:
      name: meili-data
      mountPath: /meili_data
      sizeGB: 2
    envVars:
      - key: MEILI_ENV
        value: production
      - key: MEILI_NO_ANALYTICS
        value: "true"
      - key: MEILI_HTTP_ADDR
        value: 0.0.0.0:7700
      - key: PORT
        value: "7700"
      - key: MEILI_MASTER_KEY
        generateValue: true

  - type: web
    name: trophy-heaven-medusa
    runtime: docker
    dockerfilePath: ./apps/medusa/Dockerfile
    dockerContext: .
    region: singapore
    plan: 1c-2g
    branch: main
    autoDeployTrigger: commit
    healthCheckPath: /health
    preDeployCommand: medusa db:migrate
    buildFilter:
      paths:
        - apps/medusa/**
        - packages/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "9000"
      - key: MEDUSA_WORKER_MODE
        value: shared
      # Render's private Postgres connection does not use TLS.
      - key: DATABASE_SSL
        value: "false"
      - key: OTP_DEV_ECHO
        value: "false"
      - key: S3_REGION
        value: auto

      - key: DATABASE_URL
        fromDatabase:
          name: trophy-heaven-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: trophy-heaven-redis
          property: connectionString
      - key: MEILISEARCH_HOST
        fromService:
          type: pserv
          name: trophy-heaven-search
          property: hostport
      - key: MEILISEARCH_API_KEY
        fromService:
          type: pserv
          name: trophy-heaven-search
          envVarKey: MEILI_MASTER_KEY

      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      # Copy this value into Vercel as STOREFRONT_SERVER_KEY.
      - key: STOREFRONT_SERVER_KEY
        generateValue: true

      # The storefront's exact origin, e.g. https://trophy-heaven.vercel.app
      - key: STORE_CORS
        sync: false

      # Cloudflare R2 (required: the backend refuses to start without S3_ENDPOINT).
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: CDN_BASE_URL
        sync: false

      # "true" on a client-test site: shows the sign-in code on the login page, so no email
      # setup is needed. Anyone could enter any account, so never use it for launch.
      - key: OTP_TEST_MODE
        sync: false

      # Optional on a test site. Required for launch: sign-in codes and order emails.
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: ORDER_NOTIFY_EMAIL
        sync: false

      # Optional: phone sign-in codes.
      - key: MSG91_AUTH_KEY
        sync: false
      - key: MSG91_SENDER_ID
        sync: false

      # Payments. Leave blank at first; see "Turn on payments" in docs/deployment.md.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      # "true" allows unpaid test orders while Razorpay is off. Never leave on for launch.
      - key: ALLOW_TEST_PAYMENTS
        sync: false

  # To scale later, set MEDUSA_WORKER_MODE=server on the web service and add a worker:
  # - type: worker
  #   name: trophy-heaven-worker
  #   runtime: docker
  #   dockerfilePath: ./apps/medusa/Dockerfile
  #   dockerContext: .
  #   region: singapore
  #   plan: 1c-2g
  #   envVars: same as the web service, plus
  #     MEDUSA_WORKER_MODE=worker and DISABLE_MEDUSA_ADMIN=true
