# Local development parity for the Legacy Crafts backing services.
# Stack per docs/kit/00-index.md: PostgreSQL 18, Redis 7, Meilisearch v1.
#
#   docker compose up -d
#
# The Medusa backend (apps/medusa) and storefront (apps/storefront) run on the
# host via `pnpm dev`, pointing at these services through .env.

services:
  postgres:
    image: postgres:18-alpine
    container_name: legacy-crafts-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: medusa
      POSTGRES_PASSWORD: medusa
      POSTGRES_DB: legacy_crafts
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medusa -d legacy_crafts"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: legacy-crafts-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: legacy-crafts-meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: masterKey_dev_only_change_me
      MEILI_ENV: development
    ports:
      - "7700:7700"
    volumes:
      - meili_data:/meili_data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7700/health"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  meili_data:
