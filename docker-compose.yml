# Trophy Heaven local development stack.
#
# Default (backing services only — matches host-service path on this VM):
#   docker compose up -d
#
# Full stack (requires Docker Engine; not available on this Cursor VM):
#   docker compose --profile apps up -d --build
#
# Postgres is pinned to 16 for parity with the host-installed cluster used here;
# bump to postgres:18-alpine when every environment is on 18.

services:
  postgres:
    image: postgres:16-alpine
    container_name: trophy-heaven-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: medusa
      POSTGRES_PASSWORD: medusa
      POSTGRES_DB: trophy_heaven
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medusa -d trophy_heaven"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: trophy-heaven-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: trophy-heaven-meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: masterKey_dev_only_change_me
      MEILI_ENV: development
    ports:
      - "7700:7700"
    volumes:
      - meili_data:/meili_data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:7700/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot migrate + seed. Runs once when the apps profile is enabled.
  medusa-init:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: apps/medusa/Dockerfile
    container_name: trophy-heaven-medusa-init
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://medusa:medusa@postgres:5432/trophy_heaven
      REDIS_URL: redis://redis:6379
      MEDUSA_BACKEND_URL: http://medusa:9000
      JWT_SECRET: supersecret_dev_jwt
      COOKIE_SECRET: supersecret_dev_cookie
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_API_KEY: masterKey_dev_only_change_me
      STORE_CORS: http://localhost:3000
      ADMIN_CORS: http://localhost:9000
      AUTH_CORS: http://localhost:3000,http://localhost:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    working_dir: /app/apps/medusa
    command: ["sh", "-c", "npx medusa db:migrate && npx medusa exec ./src/scripts/seed.ts"]
    restart: "no"

  medusa:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: apps/medusa/Dockerfile
    container_name: trophy-heaven-medusa
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://medusa:medusa@postgres:5432/trophy_heaven
      REDIS_URL: redis://redis:6379
      MEDUSA_BACKEND_URL: http://localhost:9000
      JWT_SECRET: supersecret_dev_jwt
      COOKIE_SECRET: supersecret_dev_cookie
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_API_KEY: masterKey_dev_only_change_me
      STORE_CORS: http://localhost:3000
      ADMIN_CORS: http://localhost:9000
      AUTH_CORS: http://localhost:3000,http://localhost:9000
    ports:
      - "9000:9000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      medusa-init:
        condition: service_completed_successfully

  storefront:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: apps/storefront/Dockerfile
      args:
        NEXT_PUBLIC_MEDUSA_BACKEND_URL: http://localhost:9000
        NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_BASE_URL: http://localhost:3000
    container_name: trophy-heaven-storefront
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_MEDUSA_BACKEND_URL: http://localhost:9000
      NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY:-}
      NEXT_PUBLIC_BASE_URL: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      medusa:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  meili_data:
